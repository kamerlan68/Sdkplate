name: Build ExtraTools APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q ExtraTools.zip -d extracted

          APP_FILE=$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: app/build.gradle.kts not found in ZIP"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_FILE")")
          echo "Project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Fix JVM targets
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()

          s = re.sub(
              r'compileOptions\s*\{.*?\}',
              '''compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }''',
              s, count=1, flags=re.S
          ) if "compileOptions {" in s else s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""", 1
          )

          s = re.sub(
              r'kotlinOptions\s*\{.*?\}',
              '''kotlinOptions {
                  jvmTarget = "17"
              }''',
              s, count=1, flags=re.S
          ) if "kotlinOptions {" in s else s.replace(
              "android {",
              """android {
              kotlinOptions {
                  jvmTarget = "17"
              }""", 1
          )

          p.write_text(s)
          print("JVM targets fixed to 17")
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExtraTools-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
