name: Build ExtraTools APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE"
          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            mkdir extracted
            unzip -q ExtraTools.zip -d extracted
            PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Fix JVM targets
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()

          if "compileOptions {" in s:
              import re
              s = re.sub(
                  r'compileOptions\s*\{.*?\}',
                  '''compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }''',
                  s, count=1, flags=re.S
              )
          else:
              s = s.replace("android {", """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""", 1)

          if "kotlinOptions {" in s:
              import re
              s = re.sub(
                  r'kotlinOptions\s*\{.*?\}',
                  '''kotlinOptions {
                  jvmTarget = "17"
              }''',
                  s, count=1, flags=re.S
              )
          else:
              s = s.replace("android {", """android {
              kotlinOptions {
                  jvmTarget = "17"
              }""", 1)

          p.write_text(s)
          print(p.read_text())
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExtraTools-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
